<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AURA: O Labirinto do Encontro</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
        }

        #maze-container {
            display: grid;
            grid-template-columns: repeat(12, 40px);
            grid-template-rows: repeat(12, 40px);
            border: 3px solid black;
            margin: 20px auto;
        }

        .tile {
            width: 40px;
            height: 40px;
            box-sizing: border-box;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
        }

        /* Cores das Paredes (Azul) */
        .wall {
            background-color: blue; 
            border: 1px solid darkblue;
        }

        /* Caminho */
        .path {
            background-color: #f0f0f0;
        }

        /* Ponto de Calma (Verde) */
        .calm {
            background-color: green;
            color: white;
        }

        /* Início (Mãe) */
        .start {
            background-color: pink;
            color: black;
        }

        /* Fim (Aura) */
        .end {
            background-color: yellow;
            color: purple;
            font-size: 1.5em;
            animation: pulse 1s infinite alternate;
        }

        @keyframes pulse {
            from { box-shadow: 0 0 5px yellow; }
            to { box-shadow: 0 0 15px orange; }
        }

        /* Personagem */
        .player {
            background-color: #f77f00;
            border-radius: 50%;
            z-index: 10;
            position: relative;
        }

        /* Botões */
        #level-buttons button {
            padding: 10px 20px;
            margin: 5px;
            background-color: #0066ff;
            color: white;
            border: none;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
        }

        #level-buttons button:hover {
            background-color: #0044aa;
        }
    </style>
</head>
<body>

    <h1>AURA: O Labirinto do Encontro</h1>

    <div id="level-buttons">
        <button onclick="loadLevel(EASY_MAP)">Nível Fácil</button>
        <button onclick="loadLevel(LEVEL_2_MAP)">Nível Médio</button>
    </div>

    <div id="maze-container"></div>

    <script>
        // --- Nível Fácil (10x10) ---
        const EASY_MAP = [
            ['M', '_', '_', '#', '#', '_', '_', '_', '_', '_'],
            ['#', '#', '_', '#', '_', '_', 'G', '_', '#', '_'],
            ['_', '_', '_', '#', '#', '#', '#', '#', '#', '_'],
            ['_', '#', '_', '_', '_', '_', '_', '_', '#', '_'],
            ['_', '#', '#', '#', '#', '#', '#', '_', '#', '_'],
            ['_', '_', '_', '_', '_', '_', '#', '_', '#', '_'],
            ['#', '#', '#', '#', '#', '_', '#', '_', '_', '_'],
            ['_', 'G', '#', '_', '_', '_', '_', '#', '#', '#'],
            ['_', '_', '_', '_', '#', '#', '_', '_', 'A', '_'],
            ['#', '#', '#', '#', '#', '#', '#', '#', '#', '#']
        ];

        // --- Nível Médio (12x12) ---
        const LEVEL_2_MAP = [
            ['M','_','_','#','#','#','_','_','_','#','_','_'],
            ['#','#','_','#','G','#','_','#','_','#','_','#'],
            ['_','_','_','_','_','#','_','#','_','_','_','#'],
            ['_','#','#','#','_','#','_','#','#','#','_','_'],
            ['_','_','G','#','_','_','_','_','_','#','_','_'],
            ['#','#','_','#','#','#','#','_','_','#','#','_'],
            ['_','_','_','_','G','_','#','_','_','_','_','_'],
            ['_','#','#','#','#','_','#','#','#','#','#','_'],
            ['_','_','_','_','_','_','_','G','_','_','_','_'],
            ['#','#','#','#','#','#','_','#','#','#','#','_'],
            ['_','_','_','_','G','_','_','_','_','_','#','_'],
            ['_','#','#','#','#','#','#','#','#','_','A','_']
        ];

        let playerPos = { x: 0, y: 0 };
        const mazeContainer = document.getElementById('maze-container');

        function loadLevel(map) {
            currentMap = JSON.parse(JSON.stringify(map)); // evita alterar original
            drawMaze(currentMap);
        }

        function drawMaze(map) {
            mazeContainer.innerHTML = '';

            let height = map.length;
            let width = map[0].length;

            mazeContainer.style.gridTemplateColumns = `repeat(${width}, 40px)`;
            mazeContainer.style.gridTemplateRows = `repeat(${height}, 40px)`;

            for (let y = 0; y < height; y++) {
                for (let x = 0; x < width; x++) {
                    const tile = document.createElement('div');
                    tile.classList.add('tile');
                    tile.dataset.x = x;
                    tile.dataset.y = y;

                    switch (map[y][x]) {
                        case '#':
                            tile.classList.add('wall');
                            break;
                        case 'G':
                            tile.classList.add('calm');
                            tile.textContent = 'G';
                            break;
                        case 'A':
                            tile.classList.add('end');
                            tile.textContent = 'A';
                            break;
                        case 'M':
                            playerPos = { x, y };
                            tile.classList.add('start');
                            break;
                        default:
                            tile.classList.add('path');
                    }

                    mazeContainer.appendChild(tile);
                }
            }

            placePlayer();
        }

        function placePlayer() {
            const oldPlayer = document.querySelector('.player');
            if (oldPlayer) oldPlayer.classList.remove('player');

            const newTile = document.querySelector(`[data-x="${playerPos.x}"][data-y="${playerPos.y}"]`);
            if (newTile) {
                newTile.classList.add('player');
                newTile.textContent = '👩';
            }
        }

        function movePlayer(dx, dy) {
            const newX = playerPos.x + dx;
            const newY = playerPos.y + dy;

            if (!currentMap[newY] || !currentMap[newY][newX]) return;
            const next = currentMap[newY][newX];

            if (next === '#') return;

            playerPos.x = newX;
            playerPos.y = newY;
            placePlayer();

            if (next === 'A') {
                alert("Você encontrou a Aura! ❤️");
            }
        }

        document.addEventListener('keydown', e => {
            if (e.key === "ArrowUp") movePlayer(0, -1);
            if (e.key === "ArrowDown") movePlayer(0, 1);
            if (e.key === "ArrowLeft") movePlayer(-1, 0);
            if (e.key === "ArrowRight") movePlayer(1, 0);
        });

        // Inicia com o nível fácil
        let currentMap = EASY_MAP;
        loadLevel(EASY_MAP);
    </script>
</body>
</html>

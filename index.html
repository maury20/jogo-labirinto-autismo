<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AURA: O Labirinto do Encontro - Emojis Personagens</title>

    <style>
        /* ------------------------------------- */
        /* CÓDIGO CSS (Estilo e Design do Labirinto) */
        /* ------------------------------------- */
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; display: flex; flex-direction: column; align-items: center; background-color: #f0f8ff; color: #333; padding: 10px; }
        h1 { color: #d0021b; margin-bottom: 5px; font-size: 1.6em; }
        #game-info { display: flex; gap: 40px; margin-bottom: 15px; font-size: 1.1em; padding: 10px 20px; border: 2px solid #ccc; border-radius: 8px; background-color: #fff; box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1); }
        #focus-meter { color: #d0021b; font-weight: bold; }
        #aura-signal { font-weight: bold; }
        #maze-container { display: grid; grid-template-columns: repeat(18, 30px); grid-template-rows: repeat(18, 30px); border: 4px solid #1a1a1a; box-shadow: 0 0 20px rgba(0, 0, 0, 0.3); background-color: #e6e6e6; }
        .tile { width: 30px; height: 30px; box-sizing: border-box; display: flex; justify-content: center; align-items: center; font-weight: bold; font-size: 1.2em; transition: background-color 0.1s; }

        /* Paredes Coloridas */
        .wall-blue { background-color: #4a90e2; border: 1px solid #357ae8; }
        .wall-yellow { background-color: #f8e71c; border: 1px solid #e1d30f; }
        .wall-red { background-color: #d0021b; border: 1px solid #a80017; }
        .wall-green { background-color: #7ed321; border: 1px solid #5fb50d; }
        
        /* PORTA, MÓVEIS e OBSTÁCULOS */
        .door { background-color: #b8860b; border: 1px solid #8b6508; } 
        .sofa { background-color: #8B4513; border: 1px solid #69340f; } 
        .bed { background-color: #b0c4de; border: 1px solid #9fb3cc; } 
        .table { background-color: #a0522d; border: 1px solid #733a1e; } 

        /* NOVOS EMOJIS DE FOCO/RECUPERAÇÃO */
        .retreat { background-color: #8B0000; color: white; } /* R: Rosto Zangado */
        .calm { background-color: #2e8b57; color: white; } /* G: Meditação */

        /* NOME DO CÔMODO (N) */
        .room-name {
            background-color: transparent; 
            color: #333;
            font-size: 0.6em; 
            font-style: italic;
            opacity: 0.7;
            text-align: center;
            line-height: 100%;
            pointer-events: none;
        }

        /* Fim (Menina) */
        .end {
            background-color: #f8e71c; 
            color: #9013fe;
            animation: pulse 1s infinite alternate; 
        }

        /* Estilo do Personagem (Mãe) */
        .player {
            background-color: #ff69b4;
            border: 3px solid #1a1a1a;
            border-radius: 50%;
            z-index: 10;
            line-height: 30px; 
        }
        @keyframes pulse { from { box-shadow: 0 0 5px #f8e71c; } to { box-shadow: 0 0 15px orange, 0 0 20px #d0021b; } }
    </style>
</head>
<body>
    <h1>AURA: O Labirinto do Encontro (Mãe 🧍‍♀️ busca a Menina 👧)</h1>
    
    <div id="game-info">
        <div id="focus-meter">Foco: <span id="f-value">100</span>%</div>
        <div id="aura-signal">Sinal da Menina: <span>🟢 Distante</span></div>
    </div>

    <div id="maze-container">
        </div>
    
    <p class="instructions">Use as setas. Cuidado: 🛋️, 🛌, 🍽️, 🚪 e a Raiva (😠) bloqueiam o caminho! Busque a Calma (🧘).</p>

    <script>
        /* ------------------------------------- */
        /* CÓDIGO JAVASCRIPT (Lógica do Jogo) */
        /* ------------------------------------- */

        // --- EMOJIS DE MÓVEIS E PERSONAGENS ---
        const EMOJI_SOFA = '🛋️';
        const EMOJI_BED = '🛌';
        const EMOJI_TABLE = '🍽️';
        const EMOJI_DOOR = '🚪';
        const EMOJI_PLAYER = '🧍‍♀️'; // Mãe de corpo todo
        const EMOJI_AURA = '👧'; // Menina
        const EMOJI_CALM = '🧘'; // Calma (G)
        const EMOJI_RETREAT = '😠'; // Recuo (R)

        // --- 1. Definição do Mapa EXTREMO (18x18) com Sala de Estar ---
        // M: Mãe, A: Aura, #: Parede, G: Calma, R: Recuo, S: Sofá, B: Cama, T: Mesa, D: Porta, N: Nome
        const CURRENT_MAP = [
            // C1 C2 C3 C4 C5 C6 C7 C8 C9 C10 C11 C12 C13 C14 C15 C16 C17 C18
            ['#', '#', '#', '#', '#', '#', '#', '#', '#', '#', '#', '#', '#', '#', '#', '#', '#', '#'], // L1
            ['#', '_', 'N', '_', '_', '_', '_', '_', '_', '#', '_', '_', '_', '_', '_', '_', '_', '#'], // L2 (N: SALA DE ESTAR)
            ['#', '_', '_', '_', 'S', '_', '_', 'S', '_', '#', '_', '#', '#', '#', '#', '#', '#', '#'], // L3 (S: Sofá)
            ['#', 'M', '#', '#', '#', '#', '#', '#', 'D', '#', '_', '#', '_', '_', '_', '_', '_', '#'], // L4 (M: Início, D: Porta Sala)
            ['#', '_', '_', '_', '_', '_', '_', '_', '_', '#', '_', '#', '_', '#', '#', '#', '#', '#'], // L5 (Corredor Lateral)
            ['#', '#', '#', 'D', '#', '#', '#', '#', '#', '#', '_', '#', '_', '#', 'N', '_', '_', '#'], // L6 (D: Porta Quarto 1 / N: COZINHA)
            ['#', '_', '_', '_', '_', '#', 'B', '_', '_', '_', '_', '#', '_', '#', '_', '#', '_', '#'], // L7 (B: Cama Q1)
            ['#', '_', '#', '#', '#', '#', '_', '#', '#', '#', '#', '#', 'T', '#', '_', '#', '_', 'D'], // L8 (T: Mesa Cozinha, D: Porta Q. Aura)
            ['#', 'N', '#', '_', '_', '_', '_', '#', '_', '_', '_', '_', '_', '_', '_', '#', '_', '#'], // L9 (N: QUARTO 1)
            ['#', '#', '#', '#', '#', '#', '#', '#', 'D', '#', 'G', '_', '_', '#', 'R', '_', '_', '#'], // L10 (D: Porta Banheiro / G: Calma / R: Recuo)
            ['#', '_', '_', '_', '_', '_', '_', '_', '_', '#', '_', '#', '_', '#', '#', '#', '#', '#'], // L11 
            ['#', 'N', '#', '#', '#', '#', '#', '#', '#', '#', '_', '#', '_', '#', 'B', '_', '_', '#'], // L12 (N: BANHEIRO, B: Cama Q2)
            ['#', '_', '_', '_', '_', '_', '_', '_', '_', '_', '_', '#', '_', '#', '#', '#', '#', '#'], // L13
            ['#', '#', '#', '#', '#', '#', '#', '#', '#', '#', '#', '#', '_', '_', '_', '_', '_', '#'], // L14
            ['#', 'D', '_', 'N', '_', '_', '_', '_', '_', '_', '#', '#', '#', '#', '#', '#', '#', '#'], // L15 (D: Porta Q2, N: QUARTO 2)
            ['#', '#', '#', '#', '#', '#', '#', '#', '#', '#', '#', '_', '_', '_', '_', '_', '_', 'A'], // L16 (A: Aura)
            ['#', '_', '_', '_', '_', '_', '_', '_', '_', '_', '_', '_', '_', '_', '_', '_', '_', '#'], // L17
            ['#', '#', '#', '#', '#', '#', '#', '#', '#', '#', '#', '#', '#', '#', '#', '#', '#', '#']  // L18
        ];

        // Mapeamento dos nomes dos cômodos para as coordenadas 'N'
        const ROOM_NAMES_SALA = {
            '2,1': 'SALA DE ESTAR',
            '14,5': 'COZINHA',
            '1,8': 'QUARTO 1',
            '1,11': 'BANHEIRO',
            '3,14': 'QUARTO 2',
            '14,16': 'QUARTO AURA'
        };
        
        // Posição da Aura (A)
        let auraPos = { x: 17, y: 16 }; 

        let playerPos = { x: 0, y: 0 }; 
        let focusValue = 100;
        const mazeContainer = document.getElementById('maze-container');
        const focusMeterDisplay = document.getElementById('f-value');
        const auraSignalDisplay = document.querySelector('#aura-signal span');
        const mapHeight = CURRENT_MAP.length; 
        const mapWidth = CURRENT_MAP[0].length; 
        
        const wallColors = ['wall-blue', 'wall-yellow', 'wall-red', 'wall-green'];
        let currentColorIndex = 0; 
        
        // --- FUNÇÕES DE ATUALIZAÇÃO E FEEDBACK (MANTIDAS) ---
        function updateFocus(change) {
            focusValue = Math.min(100, Math.max(0, focusValue + change));
            focusMeterDisplay.textContent = focusValue;
            
            if (focusValue <= 20) { focusMeterDisplay.style.color = 'red'; } else { focusMeterDisplay.style.color = '#d0021b'; }
            if (focusValue === 0) { alert("O Foco se esgotou! Reinicie a busca."); resetGame(); }
        }
        
        function updateAuraSignal() {
            const distance = Math.abs(playerPos.x - auraPos.x) + Math.abs(playerPos.y - auraPos.y);
            let signalText;
            if (distance <= 6) { signalText = '🔴 Perto! (Menina próxima)'; auraSignalDisplay.style.color = '#f5a623'; } 
            else if (distance <= 20) { signalText = '🟡 Médio (Sinal forte)'; auraSignalDisplay.style.color = '#4a90e2'; } 
            else { signalText = '🟢 Distante (Sinal fraco)'; auraSignalDisplay.style.color = '#7ed321'; }
            auraSignalDisplay.textContent = signalText;
        }

        // --- 3. Função de Renderização e Posicionamento do Jogador (Emojis Aplicados aqui) ---
        function drawMaze(map) {
            mazeContainer.innerHTML = '';
            mazeContainer.style.gridTemplateColumns = `repeat(${mapWidth}, 30px)`;
            mazeContainer.style.gridTemplateRows = `repeat(${mapHeight}, 30px)`;
            
            for (let y = 0; y < mapHeight; y++) {
                for (let x = 0; x < mapWidth; x++) {
                    const tile = document.createElement('div');
                    tile.classList.add('tile');
                    tile.dataset.x = x;
                    tile.dataset.y = y;

                    switch (map[y][x]) {
                        case '#':
                            tile.classList.add(wallColors[currentColorIndex]);
                            currentColorIndex = (currentColorIndex + 1) % wallColors.length; 
                            break;
                        case 'S':
                            tile.classList.add('sofa');
                            tile.textContent = EMOJI_SOFA; 
                            break;
                        case 'B':
                            tile.classList.add('bed');
                            tile.textContent = EMOJI_BED; 
                            break;
                        case 'T':
                            tile.classList.add('table');
                            tile.textContent = EMOJI_TABLE; 
                            break;
                        case 'D':
                            tile.classList.add('door');
                            tile.textContent = EMOJI_DOOR; 
                            break; 
                        case 'N':
                            tile.classList.add('room-name');
                            const key = `${x},${y}`;
                            if (ROOM_NAMES_SALA[key]) {
                                tile.textContent = ROOM_NAMES_SALA[key];
                            }
                            break; 
                        case 'G':
                            tile.classList.add('calm');
                            tile.textContent = EMOJI_CALM; 
                            break;
                        case 'R':
                            tile.classList.add('retreat');
                            tile.textContent = EMOJI_RETREAT; 
                            break; 
                        case 'A':
                            tile.classList.add('end');
                            tile.textContent = EMOJI_AURA; 
                            auraPos = {x: x, y: y};
                            break;
                        case 'M':
                            playerPos = { x: x, y: y }; 
                            tile.classList.add('start');
                            break;
                        case '_':
                        default:
                            tile.classList.add('path');
                            break;
                    }
                    mazeContainer.appendChild(tile);
                }
            }
            placePlayer();
            updateAuraSignal();
        }

        function placePlayer() {
            const oldPlayerTile = document.querySelector('.player');
            if (oldPlayerTile) {
                oldPlayerTile.classList.remove('player');
                oldPlayerTile.textContent = ''; 
                
                const tileType = CURRENT_MAP[oldPlayerTile.dataset.y][oldPlayerTile.dataset.x];
                
                // Restaura o emoji/letra do tile
                if (tileType === 'S') { oldPlayerTile.textContent = EMOJI_SOFA; }
                else if (tileType === 'B') { oldPlayerTile.textContent = EMOJI_BED; }
                else if (tileType === 'T') { oldPlayerTile.textContent = EMOJI_TABLE; }
                else if (tileType === 'D') { oldPlayerTile.textContent = EMOJI_DOOR; }
                else if (tileType === 'A') { oldPlayerTile.textContent = EMOJI_AURA; }
                else if (tileType === 'G') { oldPlayerTile.textContent = EMOJI_CALM; } 
                else if (tileType === 'R') { oldPlayerTile.textContent = EMOJI_RETREAT; } 
                // Nomes (N) são restaurados pelo CSS/drawMaze
            }
            
            const newPlayerTile = document.querySelector(`[data-x="${playerPos.x}"][data-y="${playerPos.y}"]`);
            if (newPlayerTile) {
                newPlayerTile.classList.add('player');
                newPlayerTile.textContent = EMOJI_PLAYER; 
            }
        }

        // --- 4. Lógica de Movimento e Interações (MANTIDA) ---
        function movePlayer(dx, dy) {
            const newX = playerPos.x + dx;
            const newY = playerPos.y + dy;
            
            if (newX < 0 || newX >= mapWidth || newY < 0 || newY >= mapHeight) { return; }

            const nextTile = CURRENT_MAP[newY][newX];

            // 1. Bloqueios Fixos
            if (nextTile === 'S' || nextTile === 'B' || nextTile === 'T' || nextTile === '#' || nextTile === 'D') {
                updateFocus(-10); 
                return; 
            }

            // 2. Colisão com Recuo Emocional (R)
            if (nextTile === 'R') {
                updateFocus(-20); 
                const backX = playerPos.x - (dx * 3);
                const backY = playerPos.y - (dy * 3);
                playerPos.x = Math.min(mapWidth - 1, Math.max(0, backX));
                playerPos.y = Math.min(mapHeight - 1, Math.max(0, backY));
                placePlayer(); 
                return; 
            }

            // 3. Ponto de Calma (G)
            if (nextTile === 'G') { updateFocus(5); }
            
            // 4. Atualizar Posição
            playerPos.x = newX;
            playerPos.y = newY;
            placePlayer();
            updateFocus(-1); 
            updateAuraSignal();

            // 5. Verificação de Condição de Vitória (A = Aura)
            if (nextTile === 'A') { gameOver(true); } 
        }
        
        function gameOver(victory) {
            if (victory) {
                alert("Vitória no Nível EXTREMO! Você encontrou a Menina (Aura).");
            }
            setTimeout(resetGame, 100);
        }
        
        function resetGame() {
             focusValue = 100;
             updateFocus(0);
             drawMaze(CURRENT_MAP); 
        }

        // --- 5. Event Listener para Teclas (Movimentação) ---
        document.addEventListener('keydown', (e) => {
            switch (e.key) {
                case 'ArrowUp': movePlayer(0, -1); break;
                case 'ArrowDown': movePlayer(0, 1); break;
                case 'ArrowLeft': movePlayer(-1, 0); break;
                case 'ArrowRight': movePlayer(1, 0); break;
            }
        });

        // Inicia o jogo
        drawMaze(CURRENT_MAP);
    </script>
</body>
</html>

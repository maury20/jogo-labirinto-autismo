<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AURA: O Labirinto do Encontro - Nível EXTREMO (Foco)</title>

    <style>
        /* ------------------------------------- */
        /* CÓDIGO CSS (Estilo e Design do Labirinto) */
        /* ------------------------------------- */
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; display: flex; flex-direction: column; align-items: center; background-color: #f0f8ff; color: #333; padding: 10px; }
        h1 { color: #d0021b; margin-bottom: 5px; font-size: 1.6em; }
        #game-info { 
            display: flex; 
            gap: 20px; 
            margin-bottom: 15px; 
            font-size: 1.1em; 
            padding: 10px 20px; 
            border: 2px solid #ccc; 
            border-radius: 8px; 
            background-color: #fff; 
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1); 
            flex-wrap: wrap; 
            justify-content: center;
        }
        #focus-meter { color: #d0021b; font-weight: bold; }
        #aura-signal { font-weight: bold; }
        #key-status { font-weight: bold; color: #b8860b; } 
        
        #reset-button {
            padding: 8px 15px;
            font-size: 1em; 
            font-weight: bold;
            color: white;
            background-color: #4a90e2; 
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-top: 10px;
        }
        #reset-button:hover {
            background-color: #357ae8;
        }
        
        #maze-container { display: grid; grid-template-columns: repeat(18, 30px); grid-template-rows: repeat(18, 30px); border: 4px solid #1a1a1a; box-shadow: 0 0 20px rgba(0, 0, 0, 0.3); background-color: #e6e6e6; }
        .tile { width: 30px; height: 30px; box-sizing: border-box; display: flex; justify-content: center; align-items: center; font-weight: bold; font-size: 1.2em; transition: background-color 0.1s; }

        /* Paredes e Itens */
        .wall-blue { background-color: #4a90e2; border: 1px solid #357ae8; }
        .wall-yellow { background-color: #f8e71c; border: 1px solid #e1d30f; }
        .wall-red { background-color: #d0021b; border: 1px solid #a80017; }
        .wall-green { background-color: #7ed321; border: 1px solid #5fb50d; }
        
        .door { background-color: #b8860b; border: 1px solid #8b6508; } 
        .locked-door { background-color: #900d0d; border: 2px solid #5a0707; color: white; } 
        .key { background-color: #ffd700; border: 1px solid #ccab00; } 
        .sofa { background-color: #8B4513; border: 1px solid #69340f; } 
        .bed { background-color: #b0c4de; border: 1px solid #9fb3cc; } 
        .table { background-color: #a0522d; border: 1px solid #733a1e; } 

        .retreat { background-color: #8B0000; color: white; } 
        .calm { background-color: #2e8b57; color: white; } 

        .room-name {
            background-color: transparent; color: #333; font-size: 0.6em; font-style: italic; opacity: 0.7; text-align: center; line-height: 100%; pointer-events: none;
        }

        .end {
            background-color: #f8e71c; color: #9013fe; animation: pulse 1s infinite alternate; 
        }

        .player {
            background-color: #ff69b4; border: 3px solid #1a1a1a; border-radius: 50%; z-index: 10; line-height: 30px; 
        }
        @keyframes pulse { from { box-shadow: 0 0 5px #f8e71c; } to { box-shadow: 0 0 15px orange, 0 0 20px #d0021b; } }
    </style>
</head>
<body>
    <h1>AURA: O Labirinto do Encontro - Nível EXTREMO 🤯</h1>
    
    <div id="game-info">
        <div id="focus-meter">Foco: <span id="f-value">100</span>%</div>
        <div id="aura-signal">Sinal da Menina: <span>🟢 Distante</span></div>
        <div id="key-status">Chave (🔑): <span>🔴 Ausente</span></div>
        </div>
    
    <button id="reset-button" onclick="resetGame()">🔁 Reiniciar Busca</button>

    <div id="maze-container">
        </div>
    
    <p class="instructions">Use as setas. **Objetivo:** Coletar a **Chave (🔑)** para abrir a porta e encontrar a Menina com **Foco > 50%**.</p>

    <script>
        /* ------------------------------------- */
        /* CÓDIGO JAVASCRIPT (Lógica do Jogo) */
        /* ------------------------------------- */

        // --- EMOJIS E ITENS ---
        const EMOJI_SOFA = '🛋️';
        const EMOJI_BED = '🛌';
        const EMOJI_TABLE = '🍽️';
        const EMOJI_DOOR = '🚪';
        const EMOJI_LOCKED_DOOR = '🔒'; 
        const EMOJI_KEY = '🔑'; 
        const EMOJI_PLAYER = '🧍‍♀️';
        const EMOJI_AURA = '👧';
        const EMOJI_CALM = '🧘'; 
        const EMOJI_RETREAT = '😠'; 

        // --- 1. Definição do Mapa EXTREMO (18x18) ---
        // L: Porta Trancada, K: Chave. O T (Talisman) foi removido e substituído por caminho ('_').
        const CURRENT_MAP = [
            // C1 C2 C3 C4 C5 C6 C7 C8 C9 C10 C11 C12 C13 C14 C15 C16 C17 C18
            ['#', '#', '#', '#', '#', '#', '#', '#', '#', '#', '#', '#', '#', '#', '#', '#', '#', '#'], // L1
            ['#', '_', 'N', '_', '_', '_', '_', '_', '_', '#', '_', '_', '_', '_', '_', '_', '_', '#'], // L2 (N: SALA DE ESTAR)
            ['#', '_', '_', '_', 'S', '_', '_', 'S', '_', '#', '_', '#', '#', '#', '#', '#', '#', '#'], // L3 (S: Sofá)
            ['#', 'M', '#', '#', '#', '#', '#', '#', 'D', '#', '_', '#', '_', '_', '_', '_', '_', '#'], // L4 (M: Início, D: Porta Sala)
            ['#', '_', '_', '_', '_', 'K', '_', '_', '_', 'L', '_', '#', '_', '#', '#', '#', '#', '#'], // L5 (Corredor Lateral)
            ['#', '#', '#', 'L', '#', '#', '#', '#', '#', '#', '_', '#', '_', '#', 'N', '_', '_', '#'], // L6 (L: PORTA TRANCADA Q1 / N: COZINHA)
            ['#', '_', '_', '_', '_', '#', 'B', '_', '_', '_', 'K', '#', '_', '#', '_', '#', '_', '#'], // L7 (B: Cama Q1, K: CHAVE)
            ['#', '_', '#', '#', '#', '#', '_', '_', '#', '#', '#', '#', 'T', '#', '_', '#', '_', 'D'], // L8 (T: Mesa Cozinha, D: Porta Q. Aura)
            ['#', 'N', '#', '_', '_', '_', '_', '#', '_', '_', '_', '_', '_', '_', '_', '#', '_', '#'], // L9 (N: QUARTO 1)
            ['#', '#', '#', '#', '#', '#', 'L', '#', 'L', '#', 'G', '_', 'K', '#', 'R', '_', '_', '#'], // L10 (D: Porta Banheiro / G: Calma / R: Recuo)
            ['#', '_', '_', '_', '_', '_', '_', 'K', '_', '#', '_', '_', '_', '#', '#', '#', '#', '#'], // L11 
            ['#', 'N', '#', '#', '#', '#', '#', '#', '#', '#', '_', '#', '_', '#', 'B', '_', '_', '#'], // L12 (N: BANHEIRO, B: Cama Q2)
            ['#', '_', '_', '_', '_', '_', '_', '_', '_', '_', '_', '#', '_', '#', '#', '#', '#', '#'], // L13
            ['#', '#', '_', '#', '#', '#', '#', '#', '#', '_', '#', '#', '_', '_', '_', '_', '_', '#'], // L14
            ['#', 'D', '_', 'N', '_', '_', '_', '_', '_', '_', '#', '#', 'L', '#', '#', '#', '#', '#'], // L15 (D: Porta Q2, N: QUARTO 2)
            ['#', '#', '#', '#', '#', '#', '#', '#', '#', '#', '#', '_', '_', '_', '_', '_', '_', 'A'], // L16 (A: Aura)
            ['#', '_', '_', '_', '_', '_', '_', '_', '_', '_', '_', '_', '_', '_', '_', '_', '_', '#'], // L17
            ['#', '#', '#', '#', '#', '#', '#', '#', '#', '#', '#', '#', '#', '#', '#', '#', '#', '#']  // L18
        ];

        let CURRENT_MAP = JSON.parse(JSON.stringify(INITIAL_MAP)); 
        
        // Mapeamento dos nomes dos cômodos (Omitido por brevidade)
        const ROOM_NAMES_SALA = {
            '2,1': 'SALA DE ESTAR', '14,5': 'COZINHA', '1,8': 'QUARTO 1', '1,11': 'BANHEIRO', '3,14': 'QUARTO 2', '14,16': 'QUARTO AURA'
        };
        
        // --- VARIÁVEIS DE ESTADO DO JOGO ---
        let playerPos = { x: 0, y: 0 }; 
        let focusValue = 100;
        let auraPos = { x: 17, y: 16 }; 
        let hasKey = false; 
        
        // Elementos DOM
        const mazeContainer = document.getElementById('maze-container');
        const focusMeterDisplay = document.getElementById('f-value');
        const auraSignalDisplay = document.querySelector('#aura-signal span');
        const keyStatusDisplay = document.querySelector('#key-status span');
        
        const mapHeight = CURRENT_MAP.length; 
        const mapWidth = CURRENT_MAP[0].length; 
        
        const wallColors = ['wall-blue', 'wall-yellow', 'wall-red', 'wall-green'];
        let currentColorIndex = 0; 
        
        // --- FUNÇÕES DE ATUALIZAÇÃO E FEEDBACK ---
        function updateFocus(change) {
            focusValue = Math.min(100, Math.max(0, focusValue + change));
            focusMeterDisplay.textContent = focusValue;
            if (focusValue <= 20) { focusMeterDisplay.style.color = 'red'; } else { focusMeterDisplay.style.color = '#d0021b'; }
            if (focusValue === 0) { alert("O Foco se esgotou! Fim de Jogo."); resetGame(); }
        }
        
        function updateKeyStatus() { 
            keyStatusDisplay.textContent = hasKey ? '🟢 Coletada' : '🔴 Ausente';
            keyStatusDisplay.style.color = hasKey ? '#2e8b57' : '#b8860b';
        }
        
        function updateAuraSignal() {
            const distance = Math.abs(playerPos.x - auraPos.x) + Math.abs(playerPos.y - auraPos.y);
            let signalText;
            if (distance <= 6) { signalText = '🔴 Perto! (Menina próxima)'; auraSignalDisplay.style.color = '#f5a623'; } 
            else if (distance <= 20) { signalText = '🟡 Médio (Sinal forte)'; auraSignalDisplay.style.color = '#4a90e2'; } 
            else { signalText = '🟢 Distante (Sinal fraco)'; auraSignalDisplay.style.color = '#7ed321'; }
            auraSignalDisplay.textContent = signalText;
        }

        // --- 3. Função de Renderização ---
        function drawMaze(map) {
            mazeContainer.innerHTML = '';
            mazeContainer.style.gridTemplateColumns = `repeat(${mapWidth}, 30px)`;
            mazeContainer.style.gridTemplateRows = `repeat(${mapHeight}, 30px)`;
            
            for (let y = 0; y < mapHeight; y++) {
                for (let x = 0; x < mapWidth; x++) {
                    const tile = document.createElement('div');
                    tile.classList.add('tile');
                    tile.dataset.x = x;
                    tile.dataset.y = y;

                    const baseTileType = INITIAL_MAP[y][x]; 

                    switch (baseTileType) {
                        case '#': tile.classList.add(wallColors[currentColorIndex]); currentColorIndex = (currentColorIndex + 1) % wallColors.length; break;
                        case 'S': tile.classList.add('sofa'); tile.textContent = EMOJI_SOFA; break;
                        case 'B': tile.classList.add('bed'); tile.textContent = EMOJI_BED; break;
                        case 'T': // TILE T agora é só caminho
                        case '_': default: tile.classList.add('path'); break;
                        
                        case 'D': tile.classList.add('door'); tile.textContent = EMOJI_DOOR; break; 
                        case 'L': tile.classList.add('locked-door'); tile.textContent = EMOJI_LOCKED_DOOR; break; 
                        case 'K': tile.classList.add('key'); tile.textContent = EMOJI_KEY; break;
                        case 'N': tile.classList.add('room-name'); const key = `${x},${y}`; if (ROOM_NAMES_SALA[key]) { tile.textContent = ROOM_NAMES_SALA[key]; } break; 
                        case 'G': tile.classList.add('calm'); tile.textContent = EMOJI_CALM; break; 
                        case 'R': tile.classList.add('retreat'); tile.textContent = EMOJI_RETREAT; break; 
                        case 'A': tile.classList.add('end'); tile.textContent = EMOJI_AURA; auraPos = {x: x, y: y}; break;
                        case 'M': playerPos = { x: x, y: y }; tile.classList.add('start'); break;
                    }
                    
                    // Se a Chave foi coletada, remove o emoji do tile visualmente
                    if (map[y][x] === '_' && (baseTileType === 'K' || baseTileType === 'L')) {
                        tile.textContent = '';
                        tile.classList.remove('key', 'locked-door');
                        if (tile.classList.contains('path')) { } else { tile.classList.add('path'); }
                    }
                    
                    mazeContainer.appendChild(tile);
                }
            }
            placePlayer();
            updateAuraSignal();
            updateKeyStatus(); 
        }

        function placePlayer() {
            const oldPlayerTile = document.querySelector('.player');
            if (oldPlayerTile) {
                oldPlayerTile.classList.remove('player');
                oldPlayerTile.textContent = ''; 
                
                const y = oldPlayerTile.dataset.y;
                const x = oldPlayerTile.dataset.x;
                
                const tileType = CURRENT_MAP[y][x];
                
                // Restaura o emoji baseado no estado do CURRENT_MAP (que é mutável)
                if (tileType === 'S') { oldPlayerTile.textContent = EMOJI_SOFA; }
                else if (tileType === 'B') { oldPlayerTile.textContent = EMOJI_BED; }
                else if (tileType === 'D') { oldPlayerTile.textContent = EMOJI_DOOR; }
                else if (tileType === 'L' && INITIAL_MAP[y][x] === 'L' && !hasKey) { oldPlayerTile.textContent = EMOJI_LOCKED_DOOR; }
                else if (tileType === 'K' && INITIAL_MAP[y][x] === 'K' && !hasKey) { oldPlayerTile.textContent = EMOJI_KEY; }
                else if (tileType === 'A') { oldPlayerTile.textContent = EMOJI_AURA; }
                else if (tileType === 'G') { oldPlayerTile.textContent = EMOJI_CALM; } 
                else if (tileType === 'R') { oldPlayerTile.textContent = EMOJI_RETREAT; } 
            }
            
            const newPlayerTile = document.querySelector(`[data-x="${playerPos.x}"][data-y="${playerPos.y}"]`);
            if (newPlayerTile) {
                newPlayerTile.classList.add('player');
                newPlayerTile.textContent = EMOJI_PLAYER; 
            }
        }

        // --- 4. Lógica de Movimento e Interações ---
        function movePlayer(dx, dy) {
            const newX = playerPos.x + dx;
            const newY = playerPos.y + dy;
            
            if (newX < 0 || newX >= mapWidth || newY < 0 || newY >= mapHeight) { return; }

            const nextTile = CURRENT_MAP[newY][newX];

            // 1. Bloqueios Fixos
            // Nota: O 'T' foi removido da lista de bloqueios aqui.
            if (nextTile === 'S' || nextTile === 'B' || nextTile === '#' || nextTile === 'D') {
                updateFocus(-10); 
                return; 
            }
            
            // 1b. Bloqueio de Porta Trancada (L)
            if (nextTile === 'L') { 
                if (hasKey) {
                    hasKey = false; 
                    CURRENT_MAP[newY][newX] = '_'; 
                    updateKeyStatus();
                    
                    playerPos.x = newX;
                    playerPos.y = newY;
                    placePlayer();
                    updateFocus(-1); 
                    updateAuraSignal();
                    return; 
                } else {
                    updateFocus(-10); 
                    alert("Esta porta está trancada! Você precisa da Chave (🔑) para passar.");
                    return;
                }
            }

            // 2. Colisão com Recuo Emocional (R)
            if (nextTile === 'R') {
                updateFocus(-20); 
                const backX = playerPos.x - (dx * 3);
                const backY = playerPos.y - (dy * 3);
                playerPos.x = Math.min(mapWidth - 1, Math.max(0, backX));
                playerPos.y = Math.min(mapHeight - 1, Math.max(0, backY));
                placePlayer(); 
                return; 
            }

            // 3. Ponto de Calma (G)
            if (nextTile === 'G') { updateFocus(5); }
            
            // 3b. Coletar Chave (K)
            if (nextTile === 'K') {
                hasKey = true;
                CURRENT_MAP[newY][newX] = '_'; 
                updateKeyStatus();
                alert("Você encontrou a Chave (🔑)!");
            }
            
            // 4. Atualizar Posição
            playerPos.x = newX;
            playerPos.y = newY;
            placePlayer();
            updateFocus(-1); 
            updateAuraSignal();

            // 5. Verificação de Condição de Vitória (A = Aura)
            if (nextTile === 'A') { gameOver(true); } 
        }
        
        // --- 5. Lógica de FIM DE JOGO SIMPLIFICADA ---
        function gameOver(victory) {
            if (victory) {
                if (focusValue > 50) {
                    // CONDIÇÃO DE VITÓRIA TOTAL (APENAS FOCO)
                    alert(`🌟 VITÓRIA COMPLETA no NÍVEL EXTREMO! 🌟\nVocê encontrou a Menina (Aura) com Foco de ${focusValue}%. Sua conexão está restaurada!`);
                } else {
                    // FALHA: FOCO BAIXO
                    alert(`FALHA DE FOCO. Você encontrou a Menina (Aura), mas seu Foco (${focusValue}%) está muito baixo (abaixo de 50%). Você precisa de mais Calma (🧘) para se conectar.`);
                }
            }
        }
        
        // --- 6. Função de Reinício do Jogo ---
        function resetGame() {
             focusValue = 100;
             hasKey = false;
             CURRENT_MAP = JSON.parse(JSON.stringify(INITIAL_MAP)); 
             drawMaze(CURRENT_MAP); 
        }

        // --- 7. Event Listener para Teclas (Movimentação) ---
        document.addEventListener('keydown', (e) => {
            switch (e.key) {
                case 'ArrowUp': movePlayer(0, -1); break;
                case 'ArrowDown': movePlayer(0, 1); break;
                case 'ArrowLeft': movePlayer(-1, 0); break;
                case 'ArrowRight': movePlayer(1, 0); break;
            }
        });

        // Inicia o jogo
        drawMaze(CURRENT_MAP);
    </script>
</body>
</html>

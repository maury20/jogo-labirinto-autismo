<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AURA: O Labirinto do Encontro - Nível Difícil</title>

    <style>
        /* ------------------------------------- */
        /* CÓDIGO CSS (Estilo e Design do Labirinto) */
        /* ------------------------------------- */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: #f0f8ff; /* Fundo suave */
            color: #333;
            padding: 20px;
        }

        h1 {
            color: #d0021b; /* Vermelho para o Nível Difícil */
            margin-bottom: 10px;
        }

        #game-info {
            display: flex;
            gap: 40px;
            margin-bottom: 20px;
            font-size: 1.1em;
            padding: 10px 20px;
            border: 2px solid #ccc;
            border-radius: 8px;
            background-color: #fff;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        #focus-meter {
            color: #d0021b; /* Vermelho para alerta/estresse */
            font-weight: bold;
        }
        
        #aura-signal {
            font-weight: bold;
        }

        /* Ajuste do Grid para 15x15 */
        #maze-container {
            display: grid;
            grid-template-columns: repeat(15, 35px); /* Reduzido para caber 15 colunas */
            grid-template-rows: repeat(15, 35px);
            border: 4px solid #1a1a1a;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.3);
            background-color: #fff;
        }

        .tile {
            width: 35px;
            height: 35px;
            box-sizing: border-box;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            font-size: 0.8em;
            transition: background-color 0.1s;
        }

        /* Cores das Paredes (Novas classes para cada cor) */
        .wall-blue {
            background-color: #4a90e2; /* Azul */
            border: 1px solid #357ae8;
        }
        .wall-yellow {
            background-color: #f8e71c; /* Amarelo */
            border: 1px solid #e1d30f;
        }
        .wall-red {
            background-color: #d0021b; /* Vermelho */
            border: 1px solid #a80017;
        }
        .wall-green {
            background-color: #7ed321; /* Verde */
            border: 1px solid #5fb50d;
        }
        
        /* Recuo Emocional (R) */
        .retreat {
            background-color: #8B0000; /* Vermelho Escuro - para diferenciar de parede vermelha */
            color: white;
            font-size: 1.2em;
            text-shadow: 1px 1px 1px #000;
        }

        /* Ponto de Calma (G) */
        .calm {
            background-color: #2e8b57; /* Verde Marinho - para diferenciar de parede verde */
            color: white;
        }

        /* Fim (Aura) */
        .end {
            background-color: #f8e71c; 
            color: #9013fe;
            font-size: 1.2em;
            animation: pulse 1s infinite alternate; 
        }

        /* Estilo do Personagem (Mãe) */
        .player {
            background-color: #ff69b4;
            border: 3px solid #1a1a1a;
            border-radius: 50%;
            z-index: 10;
            line-height: 35px; 
            font-size: 1.2em;
        }
        
        @keyframes pulse {
            from { box-shadow: 0 0 5px #f8e71c; }
            to { box-shadow: 0 0 15px orange, 0 0 20px #d0021b; }
        }

        .instructions {
            margin-top: 15px;
            font-style: italic;
            color: #666;
        }
    </style>
</head>
<body>
    <h1>AURA: O Labirinto do Encontro (NÍVEL DIFÍCIL - Cores Variadas)</h1>
    
    <div id="game-info">
        <div id="focus-meter">Foco: <span id="f-value">100</span>%</div>
        <div id="aura-signal">Sinal do Colar: <span>🟢 Calma</span></div>
    </div>

    <div id="maze-container">
        </div>
    
    <p class="instructions">Use as setas (↑ ↓ ← →) para mover Mariana pelos cômodos da casa. Todas as paredes coloridas bloqueiam. Cuidado com o Recuo Emocional (R)!</p>

    <script>
        /* ------------------------------------- */
        /* CÓDIGO JAVASCRIPT (Lógica do Jogo) */
        /* ------------------------------------- */

        // --- 1. Definição do Mapa do Nível Difícil (15x15) ---
        // M: Mãe, A: Aura, #: Parede Genérica (veremos a cor no JS), G: Ponto de Calma, R: Recuo Emocional
        // NOTA: Para garantir um caminho possível, o mapa foi cuidadosamente desenhado.
        // A cor da parede será atribuída no JS para simular as 4 cores.
        const HARD_MAP = [
            // C1 C2 C3 C4 C5 C6 C7 C8 C9 C10 C11 C12 C13 C14 C15
            ['M', '#', '#', '#', '_', '_', '_', '_', '_', '#', '#', '#', '_', '_', '_'], // L1 (Hall)
            ['_', '_', '_', '#', '_', '#', '#', '#', '_', '#', '_', '#', '_', '#', '_'], // L2
            ['_', '#', '_', '#', '_', '#', '_', '#', '_', '#', '_', '#', '_', '#', '_'], // L3
            ['_', '#', '_', '_', '_', '#', '_', '#', '_', '_', '_', '#', '_', '#', '_'], // L4 (Corredor Quartos)
            ['_', '#', '#', '#', '#', '#', '_', '#', '#', '#', '#', '#', '_', '#', '_'], // L5
            ['_', '_', '_', '_', '_', '_', '_', '#', '_', '_', '_', '_', '_', '#', '_'], // L6
            ['#', '#', '#', '#', '#', '#', '_', '#', '_', '#', '#', '#', '#', '#', '_'], // L7 (Sala de Estar)
            ['_', '_', '_', '_', '_', '_', '_', '#', '_', '#', '_', '_', '_', '_', '_'], // L8
            ['_', '#', '#', '#', '#', '#', '#', '#', '_', '#', '_', '#', '#', '#', '#'], // L9
            ['_', '#', 'R', '_', '_', '_', '_', '_', '_', '#', '_', '#', '_', '_', '_'], // L10 (Cozinha/Serviço - R)
            ['_', '#', '#', '#', '#', '#', '#', '#', '#', '#', '_', '#', '_', '#', '_'], // L11
            ['_', '_', '_', '_', '_', '_', '_', '_', '_', '_', '_', '#', '_', '#', '_'], // L12
            ['#', '#', '#', '#', '#', '#', '#', '#', '#', '#', '_', '#', '_', '#', '_'], // L13 (Banheiro)
            ['_', '_', '_', '_', '_', '_', 'G', '_', '_', '#', '_', '_', '_', '#', '_'], // L14
            ['#', '#', '#', '#', '#', '#', '#', '#', '#', '#', '#', '#', '#', '#', 'A']  // L15 (Quarto da Aura)
        ];
        
        const CURRENT_MAP = HARD_MAP;

        let playerPos = { x: 0, y: 0 }; 
        let focusValue = 100;
        const mazeContainer = document.getElementById('maze-container');
        const focusMeterDisplay = document.getElementById('f-value');
        const auraSignalDisplay = document.querySelector('#aura-signal span');
        const mapHeight = CURRENT_MAP.length; 
        const mapWidth = CURRENT_MAP[0].length; 
        
        let auraPos = { x: 14, y: 14 }; // Posição de 'A' (Aura) no HARD_MAP

        // Cores das paredes para alternar
        const wallColors = ['wall-blue', 'wall-yellow', 'wall-red', 'wall-green'];
        let currentColorIndex = 0; // Para alternar as cores das paredes

        // --- 2. Funções de Atualização e Feedback ---
        
        function updateFocus(change) {
            focusValue = Math.min(100, Math.max(0, focusValue + change));
            focusMeterDisplay.textContent = focusValue;
            
            if (focusValue <= 20) {
                 focusMeterDisplay.style.color = 'red';
            } else {
                 focusMeterDisplay.style.color = '#d0021b';
            }

            if (focusValue === 0) {
                alert("O Foco se esgotou! A pressão foi demais. Tente respirar e buscar novamente.");
                resetGame();
            }
        }
        
        function updateAuraSignal() {
            const distance = Math.abs(playerPos.x - auraPos.x) + Math.abs(playerPos.y - auraPos.y);
            let signalText;

            if (distance <= 5) { // Aura está muito próxima
                signalText = '🔴 Perto! (Amarelo Dourado)';
                auraSignalDisplay.style.color = '#f5a623';
            } else if (distance <= 15) { // Distância média
                signalText = '🟡 Médio (Azul Pulsante)';
                auraSignalDisplay.style.color = '#4a90e2';
            } else { // Aura distante
                signalText = '🟢 Distante (Verde Calmo)';
                auraSignalDisplay.style.color = '#7ed321';
            }
            auraSignalDisplay.textContent = signalText;
        }

        // --- 3. Função de Renderização e Posicionamento do Jogador ---

        function drawMaze(map) {
            mazeContainer.innerHTML = '';
            for (let y = 0; y < mapHeight; y++) {
                for (let x = 0; x < mapWidth; x++) {
                    const tile = document.createElement('div');
                    tile.classList.add('tile');
                    tile.dataset.x = x;
                    tile.dataset.y = y;

                    switch (map[y][x]) {
                        case '#':
                            // Atribui uma das 4 cores de parede
                            tile.classList.add(wallColors[currentColorIndex]);
                            currentColorIndex = (currentColorIndex + 1) % wallColors.length; // Alterna a cor
                            break;
                        case 'G':
                            tile.classList.add('calm');
                            tile.textContent = 'G';
                            break;
                        case 'R':
                            tile.classList.add('retreat');
                            tile.textContent = 'R';
                            break; 
                        case 'A':
                            tile.classList.add('end');
                            tile.textContent = 'A';
                            auraPos = {x: x, y: y};
                            break;
                        case 'M':
                            playerPos = { x: x, y: y };
                            tile.classList.add('start');
                            break;
                        case '_':
                        default:
                            tile.classList.add('path');
                            break;
                    }
                    mazeContainer.appendChild(tile);
                }
            }
            placePlayer();
            updateAuraSignal();
        }

        function placePlayer() {
            const oldPlayerTile = document.querySelector('.player');
            if (oldPlayerTile) {
                oldPlayerTile.classList.remove('player');
                oldPlayerTile.textContent = ''; 
                
                const tileType = CURRENT_MAP[oldPlayerTile.dataset.y][oldPlayerTile.dataset.x];
                if (tileType === 'G' || tileType === 'R') {
                     oldPlayerTile.textContent = tileType;
                }
            }
            
            const newPlayerTile = document.querySelector(`[data-x="${playerPos.x}"][data-y="${playerPos.y}"]`);
            if (newPlayerTile) {
                newPlayerTile.classList.add('player');
                newPlayerTile.textContent = '👩'; // Representação da Mãe
            }
        }

        // --- 4. Lógica de Movimento e Interações ---
        function movePlayer(dx, dy) {
            const newX = playerPos.x + dx;
            const newY = playerPos.y + dy;
            
            // 1. Verificar Limites
            if (newX < 0 || newX >= mapWidth || newY < 0 || newY >= mapHeight) {
                return; 
            }

            const nextTile = CURRENT_MAP[newY][newX];

            // Colisão com Recuo Emocional (R)
            if (nextTile === 'R') {
                updateFocus(-20); // Perda de Foco severa
                console.log("Colisão! Recuo Emocional (R). Foco atual: " + focusValue);
                
                const backX = playerPos.x - (dx * 3);
                const backY = playerPos.y - (dy * 3);
                
                playerPos.x = Math.min(mapWidth - 1, Math.max(0, backX));
                playerPos.y = Math.min(mapHeight - 1, Math.max(0, backY));
                
                placePlayer(); 
                return; 
            }

            // Colisão com QUALQUER PAREDE (#)
            if (nextTile === '#') {
                updateFocus(-10); // Perda de Foco padrão ao bater em qualquer parede
                return; 
            }
            
            // Ponto de Calma (G)
            if (nextTile === 'G') {
                updateFocus(5); // Pequeno ganho de Foco
            }
            
            // 4. Atualizar Posição
            playerPos.x = newX;
            playerPos.y = newY;
            placePlayer();
            updateFocus(-1); // Perda de Foco a cada movimento
            updateAuraSignal();

            // 5. Verificação de Condição de Vitória (A = Aura)
            if (nextTile === 'A') {
                gameOver(true);
            } 
        }
        
        function gameOver(victory) {
            if (victory) {
                alert("Vitória no Nível Difícil! AURA agradece a ajuda. O Encontro é o início da Compreensão.");
            }
            
            setTimeout(resetGame, 100);
        }
        
        function resetGame() {
             focusValue = 100;
             updateFocus(0);
             drawMaze(CURRENT_MAP); // Redesenha o mapa
        }


        // --- 5. Event Listener para Teclas (Movimentação) ---
        document.addEventListener('keydown', (e) => {
            switch (e.key) {
                case 'ArrowUp':
                    movePlayer(0, -1);
                    break;
                case 'ArrowDown':
                    movePlayer(0, 1);
                    break;
                case 'ArrowLeft':
                    movePlayer(-1, 0);
                    break;
                case 'ArrowRight':
                    movePlayer(1, 0);
                    break;
            }
        });

        // Inicia o jogo
        drawMaze(CURRENT_MAP);
    </script>
</body>
</html>

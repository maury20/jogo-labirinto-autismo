<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AURA - Nível Hard</title>

    <style>
        /* ------------------- CSS ------------------- */
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; display: flex; flex-direction: column; align-items: center; background-color: #f0f8ff; color: #333; padding: 10px; }
        h1 { color: #d0021b; margin-bottom: 5px; font-size: 1.6em; }
        #game-info { display: flex; gap: 40px; margin-bottom: 15px; font-size: 1.1em; padding: 10px 20px; border: 2px solid #ccc; border-radius: 8px; background-color: #fff; box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1); }
        #focus-meter { color: #d0021b; font-weight: bold; }
        #aura-signal { font-weight: bold; }
        #key-status { font-weight: bold; color: #b8860b; } 
        #message-display { 
            height: 30px; 
            color: #d0021b; 
            font-weight: bold; 
            margin-bottom: 10px; 
            font-size: 1.2em;
            text-align: center;
        }
        /* ATENÇÃO: Mudança aqui para suportar 20x20 */
        #maze-container { display: grid; grid-template-columns: repeat(20, 30px); grid-template-rows: repeat(20, 30px); border: 4px solid #1a1a1a; box-shadow: 0 0 20px rgba(0, 0, 0, 0.3); background-color: #e6e6e6; }
        .tile { width: 30px; height: 30px; box-sizing: border-box; display: flex; justify-content: center; align-items: center; font-weight: bold; font-size: 1.2em; transition: background-color 0.1s; }

        .wall-blue { background-color: #4a90e2; border: 1px solid #357ae8; }
        .wall-yellow { background-color: #f8e71c; border: 1px solid #e1d30f; }
        .wall-red { background-color: #d0021b; border: 1px solid #a80017; }
        .wall-green { background-color: #7ed321; border: 1px solid #5fb50d; }
            
        .door { background-color: #b8860b; border: 1px solid #8b6508; } 
        .locked-door { background-color: #900d0d; border: 2px solid #5a0707; color: white; } 
        .key { background-color: #ffd700; border: 1px solid #ccab00; } 
        .sofa { background-color: #8B4513; border: 1px solid #69340f; } 
        .bed { background-color: #b0c4de; border: 1px solid #9fb3cc; } 
        .table { background-color: #a0522d; border: 1px solid #733a1e; } 

        .retreat { background-color: #8B0000; color: white; } 
        .calm { background-color: #2e8b57; color: white; } 

        .room-name {
            background-color: transparent; 
            color: #333;
            font-size: 0.6em; 
            font-style: italic;
            opacity: 0.7;
            text-align: center;
            line-height: 100%;
            pointer-events: none;
        }

        .end {
            background-color: #f8e71c; 
            color: #9013fe;
            animation: pulse 1s infinite alternate; 
        }

        .player {
            background-color: #ff69b4;
            border: 3px solid #1a1a1a;
            border-radius: 50%;
            z-index: 10;
            line-height: 30px; 
        }
        @keyframes pulse { from { box-shadow: 0 0 5px #f8e71c; } to { box-shadow: 0 0 15px orange, 0 0 20px #d0021b; } }
    </style>
</head>
<body>
    <h1>AURA - Nível Impossível</h1>
    
    <div id="game-info">
        <div id="focus-meter">Foco: <span id="f-value">100</span>%</div>
        <div id="aura-signal">Sinal da Pulseira: <span>🔴 Distante</span></div>
        <div id="key-status">Chave (K): <span>🔴 Ausente</span></div>
    </div>
    
    <div id="message-display"></div>

    <div id="maze-container">
    </div>
    
    <p class="instructions">
          **Status do Controle:** <span id="gamepad-status">🛑 Desconectado</span>.
    </p>

            ['#', '#', '#', '#', '#', '#', '#', '#', 'L', '#', '_', '_', '_', '_', '_', '_', '_', 'B', '_', '#'],
            ['#', 'R', '_', '_', 'L', '_', '_', 'R', '#', '#', '_', 'R', '#', 'D', '#', '#', '#', '#', '#', '#'],
            ['#', '#', 'L', '#', '#', '#', '#', '#', '#', 'D', '#', '_', '#', 'G', '_', '_', '_', '_', 'K', '#'],
            ['#', '_', '_', '_', '_', '_', 'K', '_', '_', '_', '_', '_', '#', '#', '#', 'L', '#', '#', 'R', '#'],
            ['#', '#', '#', '#', '#', '#', '#', '#', 'R', '#', '#', '#', '#', '_', 'T', '_', '_', '_', '_', '#'],
            ['#', 'G', '_', 'D', '_', '_', 'L', '_', '_', '_', '_', 'L', '#', '_', '#', 'L', '#', 'B', '#', '#'],
            ['#', 'L', '#', '#', '#', '#', '#', '#', '#', '#', '#', '#', '#', '_', '#', '_', '_', '_', '_', 'A'],
            ['#', 'R', '_', '_', '_', '_', '_', '_', '_', '_', '_', '_', '_', '_', '#', '#', '#', '#', '#', '#'],
            ['#', '#', '#', '#', '#', '#', '#', '#', '#', '#', '#', '#', '#', '#', '#', '#', '#', '#', '#', '#']
        ];

        // 3. Nível Impossível: "O Vazio do Burnout" (20x20) - MAPA PADRÃO
        const IMPOSSIBLE_MAP_BURNOUT = [
            ['#', '#', '#', '#', '#', '#', '#', '#', '#', '#', '#', '#', '#', '#', '#', '#', '#', '#', '#', '#'],
            ['#', 'M', 'R', '#', 'K', 'L', '_', '_', 'R', '#', 'L', '_', '_', '_', 'R', '#', 'G', '_', 'L', '#'],
            ['#', '_', 'k', '#', '#', '#', '#', '#', '#', '#', '#', '#', '#', '#', '#', '#', '#', '#', '#', '#'],
            ['#', 'R', '_', 'L', '_', '_', 'G', 'R', '_', 'T', '_', 'D', 'R', 'L', '_', 'K', '_', 'R', 'D', '#'],
            ['#', '#', '#', '#', '_', 'R', '#', '#', '#', '#', '#', '#', '#', '#', '#', '#', '#', '#', '#', '#'],
            ['#', 'L', '_', '_', 'K', '_', '_', '_', '_', 'S', '_', 'R', '_', 'T', '_', 'R', '_', 'L', '_', '#'],
            ['#', '#', '#', 'R', '#', '#', '#', 'L', '#', '#', '#', '#', '#', '#', '#', '#', '#', '#', '#', '#'],
            ['#', '_', '_', '_', '_', 'R', '_', '_', '_', 'G', '_', '_', '_', '_', '_', 'D', '_', 'R', '_', '#'],
            ['#', 'L', '#', '#', 'T', '#', '#', '#', '_', '#', '#', 'L', '#', 'R', '#', '#', '#', '#', '#', '#'],

            ['#', 'G', '_', 'L', '_', '_', '_', '_', 'k', '_', 'D', '_', '_', 'L', '_', '_', '_', '_', 'K', '#'],
            ['#', '#', '_', '#', '#', '#', '#', '#', '#', '#', '#', '#', '#', '#', '#', '#', 'L', '#', '#', '#'],
            ['#', 'L', '_', '_', 'R', '_', 'K', '_', 'G', '_', 'L', '_', '_', 'R', '_', 'B', '_', '_', 'D', '#'],
            ['#', '#', '#', '_', '#', '#', '#', 'L', '#', '#', '#', '#', '#', '#', '#', '#', '#', 'R', '#', '#'],
            ['#', 'R', '_', '_', '_', '_', '_', '_', '_', 'D', 'R', '_', 'S', '_', 'L', '_', '_', '_', '_', '#'],
            ['#', '#', 'L', '#', 'R', '#', '#', 'K', '#', '#', '#', '#', 'K', '#', '#', '#', '#', '#', 'R', '#'],
            ['#', 'K', '_', '_', '_', '_', 'G', '_', '_', '_', 'L', '_', '_', 'T', '_', 'K', '_', 'L', '_', 'A'],
            ['#', 'R', '#', '#', '#', 'R', '#', '#', '#', 'D', '#', 'R', '_', 'L', '_', '#', '#', '#', '#', '#'],
            ['#', '#', '#', '#', '#', '#', '#', '#', '#', '#', '#', '#', '#', '#', '#', '#', '#', '#', '#', '#']
        ];

        // Agrupa todos os mapas para seleção
        const ALL_MAPS = {
            'FACIL': ORIGINAL_MAP,
            'DIFICIL': HARD_MAP_ANXIETY,
            'MESTRE': MASTER_MAP_CRITICISM,
            'IMPOSSIVEL': IMPOSSIBLE_MAP_BURNOUT
        };

        // Seleciona a dificuldade padrão
        let currentDifficulty = 'IMPOSSIVEL';
        let CURRENT_MAP = ALL_MAPS[currentDifficulty];
        
        // ATUALIZAÇÃO: Redefinir as dimensões do mapa baseadas no mapa selecionado (20x20)
        let mapHeight = CURRENT_MAP.length; 
        let mapWidth = CURRENT_MAP[0].length; 
        
        const ROOM_NAMES_SALA = {
            '2,1': 'SALA DE ESTAR', '14,5': 'COZINHA', '1,8': 'QUARTO 1', '1,11': 'BANHEIRO', '3,14': 'QUARTO 2', '17,17': 'QUARTO AURA' // Posições adaptadas
        };
        
        let playerPos = { x: 0, y: 0 }; 
        let focusValue = 100;
        let auraPos = { x: 0, y: 0 }; // Será redefinida ao desenhar o mapa
        let hasKey = false; 
        
        // Elementos DOM
        const mazeContainer = document.getElementById('maze-container');
        const focusMeterDisplay = document.getElementById('f-value');
        const auraSignalDisplay = document.querySelector('#aura-signal span');
        const keyStatusDisplay = document.querySelector('#key-status span'); 
        const messageDisplay = document.getElementById('message-display'); 
        const gamepadStatusDisplay = document.getElementById('gamepad-status');
        
        const wallColors = ['wall-blue', 'wall-yellow', 'wall-red', 'wall-green'];
        let currentColorIndex = 0; 
        
        // Estado do Gamepad
        let gamepadIndex = null;
        let lastMoveTime = 0;
        const MOVE_COOLDOWN = 120; // Cooldown para movimentos (Gamepads e Teclado Rápido)

        function copyMap(map) {
            return map.map(row => [...row]);
        }
        
        /* --- Funções de Jogo e Estado --- */

        function updateFocus(change) {
            focusValue = Math.min(100, Math.max(0, focusValue + change));
            focusMeterDisplay.textContent = focusValue;
            if (focusValue <= 20) { focusMeterDisplay.style.color = 'red'; } else { focusMeterDisplay.style.color = '#d0021b'; }
            
            if (focusValue === 0) { 
                messageDisplay.textContent = "O Foco se esgotou! Reiniciando..."; 
                gameOver(false, true); 
                return;
            }
        }
        
        function updateKeyStatus() { 
            keyStatusDisplay.textContent = hasKey ? '🟢 com a chave' : '🔴 sem a chave';
            keyStatusDisplay.style.color = hasKey ? '#2e8b57' : '#b8860b';
        }

        function updateAuraSignal() {
            const distance = Math.abs(playerPos.x - auraPos.x) + Math.abs(playerPos.y - auraPos.y);
            let signalText;
            if (distance <= 6) { signalText = '🟢 Perto! (Menina próxima)'; auraSignalDisplay.style.color = '#7ed321'; } 
            else if (distance <= 20) { signalText = '🟡 Médio (Sinal forte)'; auraSignalDisplay.style.color = '#4a90e2'; } 
            else { signalText = '🔴 Distante (Sinal fraco)'; auraSignalDisplay.style.color = '#f5a623'; }
            auraSignalDisplay.textContent = signalText;
        }
        
        function drawMaze(map) {
            mazeContainer.innerHTML = '';
            // Usa as dimensões atualizadas
            mazeContainer.style.gridTemplateColumns = `repeat(${mapWidth}, 30px)`;
            mazeContainer.style.gridTemplateRows = `repeat(${mapHeight}, 30px)`;
            
            for (let y = 0; y < mapHeight; y++) {
                for (let x = 0; x < mapWidth; x++) {
                    const tile = document.createElement('div');
                    tile.classList.add('tile');
                    tile.dataset.x = x;
                    tile.dataset.y = y;

                    switch (map[y][x]) {
                        case '#': tile.classList.add(wallColors[currentColorIndex]); currentColorIndex = (currentColorIndex + 1) % wallColors.length; break;
                        case 'S': tile.classList.add('sofa'); tile.textContent = EMOJI_SOFA; break;
                        case 'B': tile.classList.add('bed'); tile.textContent = EMOJI_BED; break;
                        case 'T': tile.classList.add('table'); tile.textContent = EMOJI_TABLE; break;
                        case 'D': tile.classList.add('door'); tile.textContent = EMOJI_DOOR; break; 
                        case 'L': tile.classList.add('locked-door'); tile.textContent = EMOJI_LOCKED_DOOR; break; 
                        case 'K': tile.classList.add('key'); tile.textContent = EMOJI_KEY; break;
                        case 'N': tile.classList.add('room-name'); const key = `${x},${y}`; if (ROOM_NAMES_SALA[key]) { tile.textContent = ROOM_NAMES_SALA[key]; } break; 
                        case 'G': tile.classList.add('calm'); tile.textContent = EMOJI_CALM; break;
                        case 'R': tile.classList.add('retreat'); tile.textContent = EMOJI_RETREAT; break; 
                        case 'A': tile.classList.add('end'); tile.textContent = EMOJI_AURA; auraPos = {x: x, y: y}; break;
                        case 'M': tile.classList.add('start'); break; 
                        case '_': default: tile.classList.add('path'); break;
                    }
                    mazeContainer.appendChild(tile);
                }
            }
            placePlayer();
        }

        function placePlayer() {
            const oldPlayerTile = document.querySelector('.player');
            if (oldPlayerTile) {
                oldPlayerTile.classList.remove('player');
                oldPlayerTile.textContent = ''; 
                
                const tileType = CURRENT_MAP[oldPlayerTile.dataset.y][oldPlayerTile.dataset.x];
                
                if (tileType === 'S') { oldPlayerTile.textContent = EMOJI_SOFA; }
                else if (tileType === 'B') { oldPlayerTile.textContent = EMOJI_BED; }
                else if (tileType === 'T') { oldPlayerTile.textContent = EMOJI_TABLE; }
                else if (tileType === 'D') { oldPlayerTile.textContent = EMOJI_DOOR; }
                else if (tileType === 'L') { oldPlayerTile.textContent = EMOJI_LOCKED_DOOR; }
                else if (tileType === 'A') { oldPlayerTile.textContent = EMOJI_AURA; }
                else if (tileType === 'G') { oldPlayerTile.textContent = EMOJI_CALM; } 
                else if (tileType === 'R') { oldPlayerTile.textContent = EMOJI_RETREAT; } 
                else if (tileType === 'M') { oldPlayerTile.textContent = ''; }
            }
            
            const newPlayerTile = document.querySelector(`[data-x="${playerPos.x}"][data-y="${playerPos.y}"]`);
            if (newPlayerTile) {
                newPlayerTile.classList.add('player');
                newPlayerTile.textContent = EMOJI_PLAYER; 
            }
        }

        function movePlayer(dx, dy) {
            if (focusValue === 0) return; // Não permite movimento se o foco for zero

            const newX = playerPos.x + dx;
            const newY = playerPos.y + dy;
            
            if (newX < 0 || newX >= mapWidth || newY < 0 || newY >= mapHeight) { return; }

            const nextTile = CURRENT_MAP[newY][newX];

            // 1. Bloqueios Fixos (Parede, Mesa, Porta)
            if (nextTile === '#' || nextTile === 'T' || nextTile === 'D') {
                updateFocus(-10); 
                return; 
            }
            
            // 1b. Interação com Sofá (S) - Descanso (+5 Foco)
            if (nextTile === 'S') {
                updateFocus(5); 
                return; 
            }

            // 1c. Interação com Cama (B) - Descanso (+15 Foco)
            if (nextTile === 'B') {
                updateFocus(15); 
                return;
            }
            
            // 1d. Bloqueio de Porta Trancada (L)
            if (nextTile === 'L') {
                if (hasKey) {
                    hasKey = false; 
                    
                    CURRENT_MAP[newY][newX] = '_';
                    
                    // Atualiza a representação visual da porta
                    const unlockedTile = document.querySelector(`[data-x="${newX}"][data-y="${newY}"]`);
                    if (unlockedTile) {
                        unlockedTile.classList.remove('locked-door');
                        unlockedTile.classList.add('path');
                        unlockedTile.textContent = ''; 
                    }
                    
                    updateKeyStatus();
                    
                    playerPos.x = newX;
                    playerPos.y = newY;
                    placePlayer(); 
                    updateFocus(-1); 
                    updateAuraSignal();
                    return; 
                } else {
                    updateFocus(-10); 
                    messageDisplay.textContent = "Porta trancada! Precisa da Chave (🔑).";
                    return;
                }
            }

            // 2. Colisão com Recuo Emocional (R) (-20 Foco e Recuo de 3 tiles)
            if (nextTile === 'R') {
                updateFocus(-20); 
                const backX = playerPos.x - (dx * 3);
                const backY = playerPos.y - (dy * 3);
                
                // Teleporta o jogador para 3 casas atrás (ou no limite do mapa)
                playerPos.x = Math.min(mapWidth - 1, Math.max(0, backX));
                playerPos.y = Math.min(mapHeight - 1, Math.max(0, backY));
                
                placePlayer(); 
                updateAuraSignal();
                messageDisplay.textContent = "Recuo! Perdeu 20 de Foco e foi empurrado(a) para trás.";
                return; 
            }

            // 3. Ponto de Calma (G) (+5 Foco)
            if (nextTile === 'G') { 
                updateFocus(5); 
            }
            
            // 3b. Coletar Chave (K)
            if (nextTile === 'K') {
                hasKey = true;
                CURRENT_MAP[newY][newX] = '_'; // Remove a chave do mapa
                updateKeyStatus();
                messageDisplay.textContent = "Chave (🔑) com a chave!";
            }
            
            // 4. Atualizar Posição (Movimento normal)
            playerPos.x = newX;
            playerPos.y = newY;
            placePlayer();
            updateFocus(-1); // Custo de movimento normal
            updateAuraSignal();

            // 5. Verificação de Condição de Vitória (A = Aura)
            if (nextTile === 'A') { gameOver(true); } 
        }
        
        function gameOver(victory, focusDefeat = false) {
            const RESTART_DELAY = 5000; // 5 segundos
            
            if (!focusDefeat) {
                if (victory) {
                    if (focusValue > 10) { 
                        messageDisplay.textContent = `VOCÊ ACHOU AURA! Foco: ${focusValue}%. Reiniciando em 5 segundos...`;
                    } else {
                        messageDisplay.textContent = ` Encontro falhou. Foco muito baixo (${focusValue}%). Reiniciando em 5 segundos...`;
                    }
                } 
            }
            
            setTimeout(resetGame, RESTART_DELAY); 
        }
        
        function resetGame() {
            focusValue = 100;
            hasKey = false;
            
            // Re-seleciona o mapa (neste caso, o IMPOSSÍVEL)
            CURRENT_MAP = copyMap(ALL_MAPS[currentDifficulty]); 
            
            // ATUALIZAÇÃO ESSENCIAL: Redefine as dimensões do labirinto
            mapHeight = CURRENT_MAP.length;
            mapWidth = CURRENT_MAP[0].length;
            
            messageDisplay.textContent = ''; 

            // Encontra a posição inicial 'M'
            let startFound = false;
            for (let y = 0; y < mapHeight; y++) {
                for (let x = 0; x < mapWidth; x++) {
                    if (CURRENT_MAP[y][x] === 'M') {
                        playerPos = { x: x, y: y };
                        startFound = true;
                        break;
                    }
                }
                if (startFound) break;
            }

            drawMaze(CURRENT_MAP); 
            updateKeyStatus(); 
            updateAuraSignal(); 
        }

        /* ------------------------------------------- */
        /* --- LÓGICA DE CONTROLE (TECLADO & GAMEPAD) --- */
        /* ------------------------------------------- */
        
        function updateGamepadStatus(connected, name = '') {
            if (connected) {
                gamepadStatusDisplay.textContent = `✅ Conectado: ${name.substring(0, 30)}...`; // Limita o nome
                gamepadStatusDisplay.style.color = '#2e8b57';
            } else {
                gamepadStatusDisplay.textContent = `🛑 Desconectado`;
                gamepadStatusDisplay.style.color = '#d0021b';
            }
        }

        // Eventos de conexão e desconexão
        window.addEventListener("gamepadconnected", (e) => {
            gamepadIndex = e.gamepad.index;
            updateGamepadStatus(true, e.gamepad.id);
        });

        window.addEventListener("gamepaddisconnected", (e) => {
            if (gamepadIndex === e.gamepad.index) {
                gamepadIndex = null;
                updateGamepadStatus(false);
            }
        });


        function handleGamepadInput() {
            const gamepads = navigator.getGamepads ? navigator.getGamepads() : [];
            const gamepad = gamepads[gamepadIndex];

            if (gamepad) {
                const now = performance.now();
                
                if (focusValue === 0) {
                    requestAnimationFrame(handleGamepadInput);
                    return;
                }

                if (now < lastMoveTime + MOVE_COOLDOWN) {
                    requestAnimationFrame(handleGamepadInput);
                    return; 
                }

                let moved = false;
                let dx = 0;
                let dy = 0;
                
                const buttons = gamepad.buttons;

                // 1. Movimento pelo D-Pad (Botões 12, 13, 14, 15 no padrão)
                if (buttons[12] && buttons[12].pressed) { dy = -1; moved = true; } // Cima
                else if (buttons[13] && buttons[13].pressed) { dy = 1; moved = true; } // Baixo
                else if (buttons[14] && buttons[14].pressed) { dx = -1; moved = true; } // Esquerda
                else if (buttons[15] && buttons[15].pressed) { dx = 1; moved = true; } // Direita

                // 2. Movimento pelo Analógico Esquerdo (Eixos 0 e 1)
                const AXIS_THRESHOLD = 0.4; 
                const axisX = gamepad.axes[0] || 0; 
                const axisY = gamepad.axes[1] || 0;
                
                if (!moved) {
                    if (axisY < -AXIS_THRESHOLD) { // Cima
                        dy = -1; moved = true;
                    } else if (axisY > AXIS_THRESHOLD) { // Baixo
                        dy = 1; moved = true;
                    } else if (axisX < -AXIS_THRESHOLD) { // Esquerda
                        dx = -1; moved = true;
                    } else if (axisX > AXIS_THRESHOLD) { // Direita
                        dx = 1; moved = true;
                    }
                }

                if (moved) {
                    movePlayer(dx, dy);
                    lastMoveTime = now;
                }
            } else {
                // Tenta encontrar um gamepad caso não tenha sido detectado pelo evento
                for (let i = 0; i < gamepads.length; i++) {
                    if (gamepads[i]) {
                        gamepadIndex = i;
                        updateGamepadStatus(true, gamepads[i].id);
                        break;
                    }
                }
            }

            // Loop principal de checagem do Gamepad
            requestAnimationFrame(handleGamepadInput);
        }
        
        // --- Event Listener para Teclas (Priorizando o bloqueio de scroll) ---
        document.addEventListener('keydown', (e) => {
            let dx = 0;
            let dy = 0;
            let validKey = false;

            switch (e.key) {
                case 'ArrowUp': 
                case 'w': dy = -1; validKey = true; break;
                case 'ArrowDown': 
                case 's': dy = 1; validKey = true; break;
                case 'ArrowLeft': 
                case 'a': dx = -1; validKey = true; break;
                case 'ArrowRight': 
                case 'd': dx = 1; validKey = true; break;
            }

            if (validKey) {
                e.preventDefault(); // *** ESSENCIAL: Impede o scroll da página ***
                
                // Aplica o cooldown também ao teclado 
                const now = performance.now();
                if (now < lastMoveTime + MOVE_COOLDOWN) {
                    return; 
                }

                movePlayer(dx, dy);
                lastMoveTime = now;
            }
        });

        // Inicia o jogo e o loop de checagem do Gamepad
        resetGame();
        handleGamepadInput(); 
    </script>
</body>
</html>
